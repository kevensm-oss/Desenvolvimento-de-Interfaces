<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 01 – JavaScript | CEUB ADS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Minha primeira aplicação JavaScript</h1>
    <p>Desenvolvimento de Interface · ADS · CEUB</p>
    <p class="dica">Abra o Console (F12) para ver os Laboratórios 1 e os exercícios de fixação.</p>
  </header>

  <main class="container">

    <!-- Laboratório 2: Calculadora de operações -->
    <section class="cartao" aria-labelledby="titulo-calc">
      <h2 id="titulo-calc">Calculadora JavaScript</h2>

      <label for="numero1">Primeiro número:</label>
      <input type="number" id="numero1" placeholder="Digite um número">

      <label for="numero2">Segundo número:</label>
      <input type="number" id="numero2" placeholder="Digite um número">

      <button id="btnCalcular">Calcular</button>

      <div id="resultado" aria-live="polite">Os resultados aparecerão aqui.</div>
    </section>

    <!-- Laboratório 3: Calculadora de média -->
    <section class="cartao" aria-labelledby="titulo-media">
      <h2 id="titulo-media">Calculadora de Média</h2>

      <label for="nota1">Nota 1:</label>
      <input type="number" id="nota1" min="0" max="10" step="0.1">

      <label for="nota2">Nota 2:</label>
      <input type="number" id="nota2" min="0" max="10" step="0.1">

      <label for="nota3">Nota 3:</label>
      <input type="number" id="nota3" min="0" max="10" step="0.1">

      <button id="calcular">Calcular Média</button>

      <div id="resultadoMedia" aria-live="polite">Informe as três notas (0 a 10).</div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
